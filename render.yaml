services:
  - type: web
    name: career-ai-taiga-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Career AI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: career-ai-taiga-demo
          envVarKey: RENDER_EXTERNAL_URL
      - key: CAREER_AI_WEB_ENABLED
        value: "true"
      - key: CAREER_AI_DEMO_LOGIN_ENABLED
        value: "true"
      - key: CAREER_AI_GOOGLE_CALENDAR_ENABLED
        value: "true"
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        value: https://career-ai-taiga-demo.onrender.com/google-calendar/callback
      - key: DB_DATABASE
        value: /tmp/career-ai.sqlite
      - key: DB_SSLMODE
        value: require
      - key: DB_URL
        sync: false
      - key: CAREER_AI_OWNER_EMAIL
        sync: false
      - key: NEON_PLAN
        value: free
      - key: NEON_STORAGE_LIMIT_BYTES
        value: 1073741824
      - key: NEON_MONTHLY_CU_LIMIT
        value: 100
      - key: NEON_ESTIMATED_MIN_CU
        value: 0.25
      - key: NEON_ESTIMATED_SUSPEND_SECONDS
        value: 300
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_LEVEL
        value: warning
      - key: LOG_CHANNEL
        value: stderr
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
